# Staging-only A/B for the Metal few-token MUL_MAT_ID kernel (kernel_mul_mv_id_ext).
# head = this branch, base = upstream tag (default b12722, the branch's merge base) with head's
# tests/test-backend-ops.cpp overlaid so both arms run the same cases; head is also run with the kill switch
# GGML_METAL_MUL_MV_ID_EXT_DISABLE=1 (old kernel_mul_mv_id path inside the head binary).
name: staging-metal-mvid

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: upstream ggml-org/llama.cpp ref for the base arm
        default: b12722
      reps:
        description: perf repetitions per arm (interleaved)
        default: '3'
  push:
    branches:
      - metal-mul-mv-id-ext
    paths:
      - 'ggml/src/ggml-metal/**'
      - 'tests/test-backend-ops.cpp'
      - '.github/workflows/staging-metal-mvid.yml'
      - '.github/staging/**'

concurrency:
  group: staging-metal-mvid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metal-ab:
    runs-on: macos-15
    timeout-minutes: 300

    env:
      BASE_REF: ${{ inputs.base_ref || 'b12722' }}
      REPS: ${{ inputs.reps || '3' }}
      # the new eval cases (128 experts, top-8) and the Inkling-like perf cases
      NEW_CASES: 'n_mats=128,n_used=8,'
      INK_PERF: 'n_mats=128,n_used=8,b=[01],m=2304,'

    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 50

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.BASE_REF }}
          path: base
          fetch-depth: 1

      - name: Check pairing and overlay the test file
        run: |
          set -euo pipefail
          mkdir -p logs
          BASE_SHA=$(git -C base rev-parse HEAD)
          HEAD_SHA=$(git -C head rev-parse HEAD)
          {
            echo "base_ref=$BASE_REF base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
            git -C head log --oneline -10
          } | tee logs/pairing.log
          git -C head fetch --depth=50 origin "$BASE_SHA" || true
          if ! git -C head merge-base --is-ancestor "$BASE_SHA" HEAD; then
            echo "::error::base $BASE_REF ($BASE_SHA) is not an ancestor of head: the A/B would not be against the merge base"
            exit 1
          fi
          git -C head diff --stat "$BASE_SHA" HEAD | tee -a logs/pairing.log
          cp head/tests/test-backend-ops.cpp base/tests/test-backend-ops.cpp
          sysctl -n machdep.cpu.brand_string hw.logicalcpu hw.memsize | tee logs/host.log
          sw_vers | tee -a logs/host.log

      - name: Build head and base
        run: |
          set -euo pipefail
          for arm in head base; do
            cmake -S "$arm" -B "$arm/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_METAL=ON \
              -DLLAMA_FATAL_WARNINGS=ON \
              -DLLAMA_OPENSSL=OFF \
              -DLLAMA_BUILD_SERVER=OFF 2>&1 | tee "logs/cmake_$arm.log"
            cmake --build "$arm/build" --config Release --target test-backend-ops -j "$(sysctl -n hw.logicalcpu)" 2>&1 | tee "logs/build_$arm.log"
          done

      - name: Offline Metal shader compile of head (diagnostic)
        continue-on-error: true
        run: |
          set -uo pipefail
          rc=0
          for f in head/build/ggml/src/ggml-metal/autogenerated/*.metal; do
            echo "== $f"
            xcrun -sdk macosx metal -c "$f" -o /dev/null || rc=1
          done 2>&1 | tee logs/shader_head.log
          exit $rc

      - name: Device info
        run: |
          set -uo pipefail
          head/build/bin/test-backend-ops support -o MUL_MAT_ID -b MTL0 -p 'n_mats=128,n_used=8,b=0,m=194,n=3,k=256,m_v=0,ids_offset=0,skip=0$' > logs/device_info.log 2>&1 || true
          head -80 logs/device_info.log

      - name: Eval (vs CPU)
        run: |
          set -uo pipefail
          B=head/build/bin/test-backend-ops
          $B -o MUL_MAT_ID -b MTL0 > logs/eval_head.log 2>&1; echo "eval_head exit $?" | tee -a logs/exit_codes.log
          GGML_METAL_MUL_MV_ID_EXT_DISABLE=1 $B -o MUL_MAT_ID -b MTL0 -p "$NEW_CASES" > logs/eval_head_killswitch.log 2>&1; echo "eval_head_killswitch exit $?" | tee -a logs/exit_codes.log
          base/build/bin/test-backend-ops -o MUL_MAT_ID -b MTL0 -p "$NEW_CASES" > logs/eval_base.log 2>&1; echo "eval_base exit $?" | tee -a logs/exit_codes.log
          tail -5 logs/eval_head.log logs/eval_head_killswitch.log logs/eval_base.log

      - name: Perf, Inkling-like shapes (interleaved reps)
        run: |
          set -uo pipefail
          for r in $(seq 1 "$REPS"); do
            base/build/bin/test-backend-ops perf -o MUL_MAT_ID -b MTL0 -p "$INK_PERF" > "logs/perf_base_rep$r.log" 2>&1
            GGML_METAL_MUL_MV_ID_EXT_DISABLE=1 head/build/bin/test-backend-ops perf -o MUL_MAT_ID -b MTL0 -p "$INK_PERF" > "logs/perf_head_killswitch_rep$r.log" 2>&1
            head/build/bin/test-backend-ops perf -o MUL_MAT_ID -b MTL0 -p "$INK_PERF" > "logs/perf_head_rep$r.log" 2>&1
          done
          grep -h "us/run" logs/perf_head_rep1.log | head -20 || true

      - name: Perf, full MUL_MAT_ID
        run: |
          set -uo pipefail
          base/build/bin/test-backend-ops perf -o MUL_MAT_ID -b MTL0 > logs/perf_base_full.log 2>&1
          head/build/bin/test-backend-ops perf -o MUL_MAT_ID -b MTL0 > logs/perf_head_full.log 2>&1
          tail -3 logs/perf_base_full.log logs/perf_head_full.log

      - name: Summary and verdict
        run: python3 head/.github/staging/metal_mvid_summary.py logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-metal-mvid-logs
          path: logs/
          retention-days: 14
